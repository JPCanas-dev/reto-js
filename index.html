<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rick and Morty</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <div class="logos">

            <!-- <img src="logo-1.png" alt="Rick and Morty Icon" id="logoIcon"> -->

            <img src="logo-2.png" alt="Rick and Morty Logo" id="logoTitle">

        </div>

        <h1>
            Explore your favorite<br>characters
        </h1>

    </header>

    <main>

        <!-- Filtro dinámico -->
        <div class="topControls">

            <select id="genderFilter" onchange="filterCharacters()">
                <option value="all">All</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="unknown">Unknown</option>
            </select>

        </div>

        <!-- Lista de personajes -->
        <ul id="character"></ul>

        <!-- Paginación -->
        <p id="pageNumber"></p>

        <!-- Botones -->
        <div class="buttons">

            <button id="prevBtn" data-prev="" onclick="prevPage()">
                Anterior
            </button>

            <button id="nextBtn" data-next="" onclick="nextPage()">
                Siguiente
            </button>

        </div>

    </main>

    <!-- Axios CDN -->
    <script src="https://cdn.jsdelivr.net/npm/axios@1.16.0/dist/axios.min.js"></script>

    <script src="api.js"></script>

</body>

</html>
